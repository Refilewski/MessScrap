<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MessScrap — Messenger Chat Exporter</title>
  <desc id="desc">Modern MessScrap banner. Export Messenger conversations on Windows, Android and iOS through Orion Browser. Includes a chat preview and a JSON export illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/><stop offset=".56" stop-color="#111831"/><stop offset="1" stop-color="#17143B"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65DFF7"/><stop offset=".48" stop-color="#7197FF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="brandText" x1="280" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DE9FF"/><stop offset="1" stop-color="#AA9BFF"/>
    </linearGradient>
    <linearGradient id="outgoing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#756CF9"/><stop offset="1" stop-color="#B28BFF"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(900 148) rotate(90) scale(310 445)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6555D4" stop-opacity=".27"/><stop offset="1" stop-color="#6555D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#BFC7EF" opacity=".13"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="19" flood-color="#030713" flood-opacity=".45"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect x="550" y="0" width="650" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#light)"/>
    <circle cx="1190" cy="-45" r="190" fill="#7C5BFF" opacity=".08"/>
    <circle cx="690" cy="345" r="170" fill="#42CFF4" opacity=".055"/>
    <path d="M610 0 523 360" fill="none" stroke="#C5C9FF" stroke-opacity=".08"/>
    <path d="M648 0 561 360" fill="none" stroke="#C5C9FF" stroke-opacity=".05"/>

    <!-- Identity -->
    <rect x="58" y="40" width="44" height="44" rx="13" fill="url(#brand)"/>
    <path d="M71 54h19a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H80l-6 5v-5h-3a3 3 0 0 1-3-3V57a3 3 0 0 1 3-3Z" fill="none" stroke="#101A35" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="m77 62 6 0m-3-3 3 3-3 3" stroke="#101A35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="67" font-size="13" font-weight="700" letter-spacing="2.2" fill="#A9B6D4">MESSENGER CHAT EXPORTER</text>

    <!-- Main message -->
    <text x="55" y="157" font-size="75" font-weight="800" letter-spacing="-3.6" fill="#F5F7FF">Mess<tspan fill="url(#brandText)">Scrap</tspan></text>
    <text x="60" y="204" font-size="24" font-weight="650" fill="#E6EBFF">Your chats. Your archive.</text>
    <text x="60" y="233" font-size="15.5" fill="#9AAAC8">Save conversations, replies, reactions and more.</text>

    <!-- Platform support pills -->
    <g font-size="14" font-weight="700">
      <rect x="58" y="275" width="126" height="39" rx="11" fill="#222D49" stroke="#3A4869"/>
      <path d="m73 286 8-1v8h-8Zm10-1.5 9-1.5v10h-9ZM73 295h8v8l-8-1Zm10 0h9v9.5l-9-1.5Z" fill="#A7D6FF"/>
      <text x="101" y="300" fill="#E3EBFC">Windows</text>
      <rect x="193" y="275" width="125" height="39" rx="11" fill="#222D49" stroke="#3A4869"/>
      <g stroke="#B9EDCA" stroke-width="1.7" stroke-linecap="round" fill="none">
        <path d="m206 287 2-3m12 3-2-3"/>
        <path d="M205 292a8 8 0 0 1 16 0v6h-16Z" fill="#B9EDCA" stroke="none"/>
        <path d="M208 301v2m10-2v2m-16-10v5m22-5v5"/>
      </g>
      <circle cx="210" cy="289" r=".9" fill="#18243B"/><circle cx="216" cy="289" r=".9" fill="#18243B"/>
      <text x="231" y="300" fill="#E3EBFC">Android</text>
      <rect x="327" y="275" width="159" height="39" rx="11" fill="#2B2856" stroke="#7970D9"/>
      <rect x="341" y="283" width="13" height="23" rx="3.4" stroke="#D0BFFF" stroke-width="1.8" fill="none"/>
      <path d="M345 286h5" stroke="#D0BFFF" stroke-linecap="round"/>
      <circle cx="347.5" cy="302.5" r=".9" fill="#D0BFFF"/>
      <text x="364" y="300" fill="#F0E8FF">iOS</text>
      <text x="396" y="299" font-size="10.5" font-weight="600" fill="#B8B0DD">via Orion</text>
    </g>
    <text x="59" y="337" font-size="11.5" letter-spacing="1.15" font-weight="650" fill="#7182A5">BROWSER EXTENSION  +  WINDOWS CLI</text>

    <!-- Messenger conversation preview -->
    <g filter="url(#shadow)">
      <rect x="696" y="32" width="463" height="297" rx="20" fill="#151C30" stroke="#465373" stroke-width="1.2"/>
      <path d="M696 52a20 20 0 0 1 20-20h423a20 20 0 0 1 20 20v35H696Z" fill="#202940"/>
      <path d="M696 87h463" stroke="#394762"/>
      <circle cx="723" cy="59" r="15" fill="url(#brand)"/>
      <path d="M716 59h14m-14 4h9" stroke="#162441" stroke-width="2.2" stroke-linecap="round"/>
      <text x="747" y="56" font-size="14" font-weight="750" fill="#F4F6FF">Conversation preview</text>
      <text x="747" y="73" font-size="11.5" fill="#94A7CA">messenger.com</text>
      <circle cx="1111" cy="59" r="4" fill="#53D8A3"/>
      <text x="1098" y="73" text-anchor="end" font-size="10.5" fill="#79D2B5">READY</text>

      <rect x="718" y="105" width="271" height="43" rx="13" fill="#2A354F"/>
      <text x="733" y="131" font-size="15" fill="#E5EDFF">Can you save this chat?</text>
      <rect x="873" y="161" width="259" height="43" rx="13" fill="url(#outgoing)"/>
      <text x="892" y="187" font-size="15" font-weight="650" fill="#15142F">Already exported ✓</text>

      <rect x="718" y="220" width="414" height="87" rx="14" fill="#202B43" stroke="#3F4F70"/>
      <rect x="733" y="238" width="43" height="49" rx="10" fill="#31345D"/>
      <path d="M748 248h11l5 5v20h-16Z" fill="none" stroke="#BEB2FF" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M759 248v5h5m-12 7h8m-8 5h8" fill="none" stroke="#BEB2FF" stroke-width="1.6" stroke-linecap="round"/>
      <text x="790" y="253" font-size="14" font-weight="700" fill="#F0F3FF">conversation_backup.json</text>
      <text x="790" y="275" font-size="12" fill="#9DADCD">Messages • replies • timestamps</text>
      <rect x="1057" y="264" width="62" height="25" rx="7" fill="#2B4860"/>
      <text x="1088" y="281" font-size="11" font-weight="750" text-anchor="middle" fill="#A7F0D5">JSON</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#8590C6" stroke-opacity=".19"/>
  </g>
</svg>
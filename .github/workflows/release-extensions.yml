name: Publish MessScrap browser extension ZIPs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-extensions.yml'
      - 'extension/**'
      - 'src/dom/**'
      - 'tests/test_txt_extension.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test standalone TXT export
        run: node tests/test_txt_extension.mjs

      - name: Build Chromium and Firefox extensions
        run: python extension/build.py

      - name: Validate ZIP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          packages = sorted(Path('bin').glob('messscrap-*.zip'))
          assert len(packages) == 2, packages
          for path in packages:
              with ZipFile(path) as archive:
                  assert archive.testzip() is None, path
                  assert {'manifest.json', 'content.js', 'popup.js'}.issubset(set(archive.namelist()))
              print(f'Validated {path}')
          PY

      - name: Publish versioned browser extension ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists. Not overwriting published artifacts."
            exit 0
          fi
          gh release create "v$VERSION" \
            "bin/messscrap-chromium-$VERSION.zip#Chrome / Brave / Orion on iOS" \
            "bin/messscrap-firefox-$VERSION.zip#Firefox (unsigned)" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MessScrap v$VERSION" \
            --notes "Browser extensions now support clean TXT transcripts alongside full JSON exports. Includes sender/time grouping, readable replies and attachment labels, and suppression of technical IDs and URLs in TXT. See README for platform installation."
